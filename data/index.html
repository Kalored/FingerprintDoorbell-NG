<!DOCTYPE html>
<html lang="%LANG%">
<head>
  <!-- created with https://bootstrapformbuilder.com/ -->
  <title>FingerprintDoorbell</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" charset="utf-8">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" type="text/css" href="bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="style.css?v=%VERSIONINFO%">
  <script src="i18n.js?v=%VERSIONINFO%"></script>
</head>
<body>
	<script>
		if (!!window.EventSource) {
			var source = new EventSource('/events');

			source.addEventListener('open', function(e) {
				console.log("Events Connected");
			}, false);

			source.addEventListener('error', function(e) {
				if (e.target.readyState != EventSource.OPEN) {
				console.log("Events Disconnected");
				}
			}, false);

			// the full log is on the log page; here the latest messages are only shown while an action is running
			// (enrollment, delete, ...). The server sends the old messages right after connecting, skip those.
			var firstMessage = true;
			var hideTimer = null;
			source.addEventListener('message', function(e) {
				var show = !firstMessage;
				if (firstMessage) {
					firstMessage = false;
					try { show = sessionStorage.getItem('showStatus') === '1'; sessionStorage.removeItem('showStatus'); } catch (err) {}
				}
				if (!show || backupJobActive) return;
				var box = document.getElementById('statusBox');
				box.innerHTML = e.data;
				box.style.display = '';
				clearTimeout(hideTimer);
				hideTimer = setTimeout(function() { box.style.display = 'none'; }, 30000);
			}, false);

			// event is fired when server side fingerlist was changed (e.g. enrollment of new finger)
			source.addEventListener('fingerlist', function(e) {
				console.log("fingerlist", e.data);
				document.getElementById('selectedFingerprint').innerHTML = e.data;
				fillAccessForm();
			}, false);

		}

		// called by forms that redirect back to this page, so the status box shows the result
		function rememberStatus()
		{
			try { sessionStorage.setItem('showStatus', '1'); } catch (err) {}
			return true;
		}

		function reconnectSensor()
		{
			var info = document.getElementById('sensorReconnectInfo');
			info.textContent = ' ' + t('reconnecting, this takes up to 10 seconds...');
			fetch('/sensor/reconnect', {method: 'POST'}).then(function() {
				setTimeout(function() { location.reload(); }, 12000);
			}).catch(function() { info.textContent = ' ' + t('request failed'); });
		}

		function selectedFingerOption()
		{
			var list = document.getElementById("selectedFingerprint");
			return list.selectedIndex >= 0 ? list.options[list.selectedIndex] : null;
		}

		function askForNewName(e)
		{
			var option = selectedFingerOption();
			if (!option) {
				e.preventDefault();
				return;
			}
			var strOldName = option.getAttribute('data-name') || '';
			var newname = prompt(t('New Name?'), strOldName);
			if (newname === null)
				document.getElementById('renameNewName').value = strOldName;
			else
				document.getElementById('renameNewName').value = newname;
		}

		function pad(n) { return (n < 10 ? '0' : '') + n; }
		// no modulo operator here: the template processor of the web server treats the percent sign as placeholder
		function minutesToTime(m) { m = parseInt(m, 10); var h = Math.floor(m / 60); var min = m - h * 60; if (h >= 24) h -= 24; return pad(h) + ':' + pad(min); }

		// fills the access time form with the schedule of the selected finger
		function fillAccessForm()
		{
			var option = selectedFingerOption();
			var panel = document.getElementById('fingerDetail');
			if (!panel) return;
			panel.classList.toggle('empty', !option);
			var inputs = panel.querySelectorAll('button, input');
			for (var k = 0; k < inputs.length; k++) inputs[k].disabled = !option;
			if (!option) {
				document.getElementById('accessFingerLabel').textContent = '(no finger selected)';
				document.getElementById('accessFingerSlot').textContent = '';
				return;
			}
			document.getElementById('accessFingerId').value = option.value;
			document.getElementById('accessFingerSlot').textContent = option.value;
			document.getElementById('accessFingerLabel').textContent = option.getAttribute('data-name') || '';
			var days = parseInt(option.getAttribute('data-days'), 10);
			var from = parseInt(option.getAttribute('data-from'), 10);
			var to = parseInt(option.getAttribute('data-to'), 10);
			var mode = 'always';
			if (days === 0) mode = 'disabled';
			else if (!(days === 127 && from === 0 && to === 1440)) mode = 'restricted';
			document.querySelector('input[name=accessMode][value=' + mode + ']').checked = true;
			for (var d = 0; d < 7; d++)
				document.getElementById('day' + d).checked = mode !== 'restricted' || (days & (1 << d)) !== 0;
			document.getElementById('accessFrom').value = minutesToTime(mode === 'restricted' ? from : 0);
			document.getElementById('accessTo').value = (mode === 'restricted' && to !== 1440) ? minutesToTime(to) : '23:59';
			updateAccessMode();
		}

		function updateAccessMode()
		{
			var restricted = document.querySelector('input[name=accessMode][value=restricted]').checked;
			document.getElementById('accessRestrictions').style.display = restricted ? '' : 'none';
		}

		// backup / restore: the sensor work is done by the device in the background, so poll the status
		// while a backup/export/restore runs its progress is shown next to the buttons, not in the status box at the top
		var backupJobActive = false;
		var backupJobTimer = null;
		function startBackupJob() { clearTimeout(backupJobTimer); backupJobActive = true; backupJobTimer = setTimeout(function () { backupJobActive = false; }, 120000); }
		function endBackupJob() { clearTimeout(backupJobTimer); backupJobTimer = setTimeout(function () { backupJobActive = false; }, 3000); }

		function setBackupStatus(text, isError)
		{
			var ids = ['backupStatus', 'exportStatus'];
			for (var i = 0; i < ids.length; i++) {
				var el = document.getElementById(ids[i]);
				if (!el) continue;
				el.textContent = text;
				el.className = isError ? 'text-danger' : 'text-muted';
			}
		}

		function pollBackupStatus(onDone)
		{
			fetch('/backup/status').then(function (r) { return r.json(); }).then(function (status) {
				if (status.state === 'running') {
					setBackupStatus(status.message + (status.total ? ' (' + status.progress + '/' + status.total + ')' : ''), false);
					setTimeout(function () { pollBackupStatus(onDone); }, 1000);
				} else {
					setBackupStatus(status.message, status.state === 'error');
					endBackupJob();
					document.getElementById('btnCreateBackup').disabled = false;
					document.getElementById('btnRestore').disabled = false;
					if (status.state === 'done' && onDone) onDone();
				}
			}).catch(function () { setTimeout(function () { pollBackupStatus(onDone); }, 2000); });
		}

		function createBackup()
		{
			startBackupJob();
			document.getElementById('btnCreateBackup').disabled = true;
			setBackupStatus('Starting backup...', false);
			fetch('/backup/create', { method: 'POST' }).then(function (r) { return r.json(); }).then(function (status) {
				if (status.state === 'error') {
					setBackupStatus(status.message, true);
					document.getElementById('btnCreateBackup').disabled = false;
					return;
				}
				pollBackupStatus(function () { window.location = '/backup/download'; });
			});
		}

		// exports only the selected fingerprint (slot number, name, access times and template) as .fpdb file
		function exportFinger()
		{
			var option = selectedFingerOption();
			if (!option) {
				setBackupStatus(t('No fingerprint selected.'), true);
				return;
			}
			startBackupJob();
			document.getElementById('btnExport').disabled = true;
			setBackupStatus(t('Starting backup...'), false);
			fetch('/backup/create?id=' + encodeURIComponent(option.value), { method: 'POST' }).then(function (r) { return r.json(); }).then(function (status) {
				if (status.state === 'error') {
					setBackupStatus(status.message, true);
					document.getElementById('btnExport').disabled = false;
					return;
				}
				pollBackupStatus(function () { document.getElementById('btnExport').disabled = false; window.location = '/backup/download'; });
			}).catch(function () {
				setBackupStatus(t('request failed'), true);
				document.getElementById('btnExport').disabled = false;
			});
		}

		// a file of a single fingerprint ("finger-5-...") is added to a free slot by default
		function restoreFileChanged()
		{
			var fileInput = document.getElementById('restoreFile');
			document.getElementById('restoreFileName').textContent = fileInput.files.length ? fileInput.files[0].name : t('Choose file');
			if (fileInput.files.length && fileInput.files[0].name.indexOf('finger-') === 0)
				document.getElementById('restoreMode').value = 'free';
		}

		function restoreBackup()
		{
			var fileInput = document.getElementById('restoreFile');
			if (!fileInput.files.length) {
				setBackupStatus('Please choose a backup file first.', true);
				return;
			}
			var mode = document.getElementById('restoreMode').value;
			var clearFirst = mode === 'clear';
			var addToFree = mode === 'free';
			var warning = clearFirst ? 'All fingerprints currently stored on the sensor will be deleted first!' : (addToFree ? 'The fingerprints are added to the next free slots, nothing is overwritten.' : 'Fingerprints with the same slot number will be overwritten.');
			if (!confirm(t('Restore the fingerprints from') + ' "' + fileInput.files[0].name + '"?\n' + t(warning)))
				return;
			var data = new FormData();
			if (clearFirst) data.append('clearFirst', 'on');
			else if (addToFree) data.append('addToFree', 'on');
			data.append('file', fileInput.files[0]);
			startBackupJob();
			document.getElementById('btnRestore').disabled = true;
			setBackupStatus('Uploading...', false);
			fetch('/backup/restore', { method: 'POST', body: data }).then(function (r) { return r.json(); }).then(function (status) {
				if (status.state === 'error') {
					setBackupStatus(status.message, true);
					document.getElementById('btnRestore').disabled = false;
					return;
				}
				pollBackupStatus(null);
			}).catch(function () {
				setBackupStatus('Upload failed.', true);
				document.getElementById('btnRestore').disabled = false;
			});
		}

		document.addEventListener('DOMContentLoaded', function () {
			document.getElementById('selectedFingerprint').addEventListener('change', fillAccessForm);
			var radios = document.querySelectorAll('input[name=accessMode]');
			for (var i = 0; i < radios.length; i++) radios[i].addEventListener('change', updateAccessMode);
			fillAccessForm();
		});
    </script>

	<nav class="navbar navbar-inverse">
		<div class="container-fluid">
			<span class="lang-switch"><a href="#" class="lang-en" onclick="return setLanguage('en')">EN</a> | <a href="#" class="lang-de" onclick="return setLanguage('de')">DE</a></span>
		  <div class="navbar-header">
			<a class="navbar-brand" href="/">%HOSTNAME% %SENSOR_LIGHT%</a>
		  </div>
		  <ul class="nav navbar-nav">
			<li class="active"><a href="#">Fingerprints</a></li>
			<li><a href="settings">Settings</a></li>
			<li><a href="mqtt">MQTT</a></li>
			<li><a href="log">Log</a></li>
		  </ul>
		</div>
	</nav>

	<div class="alert alert-custom notranslate" id="statusBox" role="alert" style="display: none"></div>

	<!-- the three forms of this page are empty on purpose: the inputs and buttons reference them with the form attribute, so the layout is free -->
	<form id="editForm" action="/editFingerprints" onsubmit="return rememberStatus()"></form>
	<form id="enrollForm" action="/enroll" onsubmit="return rememberStatus()"></form>
	<form id="accessForm" action="/access" method="post"></form>

	<div class="form-horizontal">
	<h2 class="card-title">Fingerprints (%FINGER_COUNT%)</h2>

	<div class="addbar">
	  <span class="addbar-label"><svg class="ic" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add / replace</span>
	  <input id="newFingerprintId" name="newFingerprintId" form="enrollForm" type="text" inputmode="numeric" placeholder="Slot 1-200" title="Memory slot" class="form-control input-md slot-input" required="">
	  <span class="tip" tabindex="0" data-tip="The sensor has 200 memory slots available for storing fingerprints. The choosen slot number will also be used as an ID when matches are published by MQTT.">i</span>
	  <input id="newFingerprintName" name="newFingerprintName" form="enrollForm" type="text" placeholder="Name (optional)" class="form-control input-md name-input">
	  <span class="tip r" tabindex="0" data-tip="Just for human readability you can additionally assign an name to your slot number. The name will also been published by MQTT. If the name ends with a '#' the door opener output pin is activated, too.">i</span>
	  <button id="startEnrollment" name="startEnrollment" form="enrollForm" class="btn btn-primary">Start enrollment</button>
	</div>

	<div class="finger-grid">
	  <div class="finger-list">
		<select id="selectedFingerprint" name="selectedFingerprint" form="editForm" class="form-control" size="8">
		  %FINGERLIST%
		</select>
		<input type="hidden" id="renameNewName" name="renameNewName" form="editForm">
	  </div>

	  <div class="finger-detail empty" id="fingerDetail">
		<div class="detail-head">
		  <div class="detail-title"><span class="slot-badge" id="accessFingerSlot"></span><span id="accessFingerLabel"></span></div>
		  <div class="icon-actions">
			<button id="btnRename" name="btnRename" form="editForm" class="btn btn-default btn-icon" title="Rename" onclick="askForNewName(event)"><svg class="ic" viewBox="0 0 24 24"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg><span>Rename</span></button>
			<button id="btnExport" type="button" class="btn btn-default btn-icon" title="Export" onclick="exportFinger()"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>Export</span></button>
			<button id="btnDelete" name="btnDelete" form="editForm" class="btn btn-danger btn-icon" title="Delete" onclick="return confirm(t('Delete the selected fingerprint?'))"><svg class="ic" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg><span>Delete</span></button>
		  </div>
		</div>
		<small id="exportStatus" class="text-muted"></small>

		<input type="hidden" id="accessFingerId" name="accessFingerId" form="accessForm" value="">
		<div class="detail-section">
		  <div class="detail-label"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Access <span class="tip" tabindex="0" data-tip="From - to. A window over midnight (e.g. 22:00 - 06:00) is possible. Outside of the allowed times the finger is not accepted: no match is published, the door is not opened and &quot;accessDenied&quot; is published instead. Needs a working time (NTP).">i</span></div>
		  <div class="seg">
			<label><input type="radio" name="accessMode" form="accessForm" value="always" checked><span>Always</span></label>
			<label><input type="radio" name="accessMode" form="accessForm" value="restricted"><span>Only at certain times</span></label>
			<label><input type="radio" name="accessMode" form="accessForm" value="disabled"><span>Disabled</span></label>
		  </div>
		  <div id="accessRestrictions">
			<div class="chips weekdays">
			  <label class="chip"><input type="checkbox" id="day0" name="day0" form="accessForm"><span>Mo</span></label>
			  <label class="chip"><input type="checkbox" id="day1" name="day1" form="accessForm"><span>Tu</span></label>
			  <label class="chip"><input type="checkbox" id="day2" name="day2" form="accessForm"><span>We</span></label>
			  <label class="chip"><input type="checkbox" id="day3" name="day3" form="accessForm"><span>Th</span></label>
			  <label class="chip"><input type="checkbox" id="day4" name="day4" form="accessForm"><span>Fr</span></label>
			  <label class="chip"><input type="checkbox" id="day5" name="day5" form="accessForm"><span>Sa</span></label>
			  <label class="chip"><input type="checkbox" id="day6" name="day6" form="accessForm"><span>Su</span></label>
			</div>
			<div class="timerange">
			  <input type="time" id="accessFrom" name="accessFrom" form="accessForm" class="form-control" value="00:00">
			  <span>-</span>
			  <input type="time" id="accessTo" name="accessTo" form="accessForm" class="form-control" value="23:59">
			</div>
		  </div>
		  <button id="btnSaveAccess" name="btnSaveAccess" form="accessForm" class="btn btn-primary">Save access times</button>
		</div>
	  </div>
	</div>
	</div>

	<div class="form-horizontal">
	<h2 class="card-title">Backup &amp; restore</h2>
	<div class="backup-grid">
	  <div class="backup-box">
		<div class="detail-label">Backup <span class="tip" tabindex="0" data-tip="Saves all fingerprints (sensor templates), their names and access times to a file. Keep it in a safe place, it contains your fingerprint data!">i</span></div>
		<button id="btnCreateBackup" type="button" class="btn btn-default btn-icon" onclick="createBackup()"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>Create and download backup</span></button>
	  </div>
	  <div class="backup-box">
		<div class="detail-label">Restore <span class="tip" tabindex="0" data-tip="Also works with a new sensor. After replacing the sensor use &quot;Pair a new sensor&quot; in the sensor section below. A single fingerprint exported with &quot;Export&quot; is restored the same way and goes to the next free slot.">i</span></div>
		<div class="restore-row">
		  <label class="file-pick btn btn-default btn-icon" for="restoreFile"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span id="restoreFileName">Choose file</span></label>
		  <input type="file" id="restoreFile" accept=".fpdb" onchange="restoreFileChanged()" class="file-hidden">
		  <select id="restoreMode" class="form-control">
			<option value="overwrite">Overwrite same slots</option>
			<option value="free">Add to free slots</option>
			<option value="clear">Delete all first</option>
		  </select>
		  <button id="btnRestore" type="button" class="btn btn-default" onclick="restoreBackup()">Restore backup</button>
		</div>
	  </div>
	</div>
	<small id="backupStatus" class="text-muted"></small>
	</div>

	<form class="form-horizontal" onsubmit="return rememberStatus()">
	<details class="collapsible" id="sensorDetails">
	<summary>Sensor</summary>

	<div class="form-group">
	  <label class="col-md-4 control-label">State</label>
	  <div class="col-md-4">
		<p class="form-control-static">%SENSOR_STATE%</p>
	  </div>
	</div>

	<div class="form-group">
	  <label class="col-md-4 control-label">Connection</label>
	  <div class="col-md-8">
		<button type="button" id="btnSensorReconnect" class="btn btn-default" onclick="reconnectSensor()">Reconnect sensor</button>
		<span id="sensorReconnectInfo"></span>
	  </div>
	</div>

	<div class="form-group">
	  <label class="col-md-4 control-label">Touch ring</label>
	  <div class="col-md-8">
		<label class="checkbox-inline"><input type="checkbox" id="ringLedSwitch"> LED ring on</label>
		<label class="checkbox-inline"><input type="checkbox" id="ringIgnoreSwitch"> Ignore touch ring</label><br>
		<small class="text-muted">Touch ring pin (GPIO 5): <b id="ringPin">?</b></small> <span class="tip" tabindex="0" data-tip="&quot;Ignore touch ring&quot; scans without the ring signal and is reset by a restart. More details under Settings, LED ring.">i</span>
	  </div>
	</div>
	<script>
		(function () {
			var lastClick = 0;
			function send(key, on) {
				var body = new URLSearchParams();
				body.append(key, on ? '1' : '0');
				lastClick = Date.now();
				fetch('/sensor/ring', { method: 'POST', body: body });
			}
			document.getElementById('ringLedSwitch').addEventListener('change', function () { send('led', this.checked); });
			document.getElementById('ringIgnoreSwitch').addEventListener('change', function () { send('ignore', this.checked); });
			function poll() {
				fetch('/sensor/status').then(function (r) { return r.json(); }).then(function (j) {
					document.getElementById('ringPin').textContent = j.pin ? 'touched' : 'idle (not touched)';
					if (Date.now() - lastClick > 3000) {
						document.getElementById('ringLedSwitch').checked = j.led;
						document.getElementById('ringIgnoreSwitch').checked = j.ignore;
					}
				}).catch(function () { });
			}
			// only poll while the sensor section is open
			var details = document.getElementById('sensorDetails');
			var timer = null;
			details.addEventListener('toggle', function () {
				if (details.open) { poll(); timer = setInterval(poll, 2000); }
				else clearInterval(timer);
			});
		})();
	</script>

	<div class="form-group">
	  <label class="col-md-4 control-label">Pairing <span class="tip" tabindex="0" data-tip="Needed after replacing the sensor. The sensor only accepts this device afterwards.">i</span></label>
	  <div class="col-md-4">
		<button id="btnDoPairing" name="btnDoPairing" class="btn btn-default" type="submit" formaction="pairing">Pair a new sensor</button>
	  </div>
	</div>

	<div class="form-group">
	  <label class="col-md-4 control-label">Delete</label>
	  <div class="col-md-4">
		<button id="btnDeleteAllFingerprints" name="btnDeleteAllFingerprints" class="btn btn-danger" type="submit"
		  formaction="deleteAllFingerprints" onclick="return confirm(t('This will delete all fingerprints. Are you sure you wanna do that?'))">Delete all fingerprints</button>
	  </div>
	</div>
	</details>
	</form>

	<p></p>
	<nav class="navbar navbar-default ">
		<div class="container-fluid">
			<p class="navbar-text">FingerprintDoorbell, Version %VERSIONINFO%</p>
			<p class="navbar-text">%UPTIME%</p>
			<p class="navbar-text"><a href="https://github.com/Kalored/FingerprintDoorbell-NG" target="_blank">Github</a></p>
		</div>
	</nav>

</body>
</html>
